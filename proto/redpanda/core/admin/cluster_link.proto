syntax = "proto3";

package redpanda.core.admin;

import "proto/redpanda/pbgen/options.proto";
import "proto/redpanda/pbgen/rpc.proto";
import "proto/redpanda/core/common/acl.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";

option (redpanda.pbgen.cpp_namespace) = "proto::admin";

service ClusterLinkService {
    rpc CreateClusterLink(CreateClusterLinkRequest) returns (ClusterLink) {
        option (redpanda.pbgen.rpc) = {
            authz: SUPERUSER
        };
    }
    rpc DeleteClusterLink(DeleteClusterLinkRequest)
        returns (DeleteClusterLinkResponse) {
        option (redpanda.pbgen.rpc) = {
            authz: SUPERUSER
        };
    }
    rpc GetClusterLink(GetClusterLinkRequest) returns (ClusterLink) {
        option (redpanda.pbgen.rpc) = {
            authz: SUPERUSER
        };
    }
    rpc ListClusterLinks(ListClusterLinksRequest)
        returns (ListClusterLinksResponse) {
        option (redpanda.pbgen.rpc) = {
            authz: SUPERUSER
        };
    }
    rpc UpdateClusterLink(UpdateClusterLinkRequest) returns (ClusterLink) {
        option (redpanda.pbgen.rpc) = {
            authz: SUPERUSER
        };
    }
    // Fails over a cluster link or a single mirror topic
    rpc FailOver(FailOverRequest) returns (ClusterLink) {
        option (redpanda.pbgen.rpc) = {
            authz: SUPERUSER
        };
    }
}

/* Resources */
// A ClusterLink resource
message ClusterLink {
    // The name of the cluster link
    string name = 1 [(google.api.field_behavior) = REQUIRED];
    // The UUID of the cluster link
    string uid = 2 [
        (google.api.field_behavior) = OUTPUT_ONLY,
        (google.api.field_info).format = UUID4
    ];
    // Cluster link configuration
    ClusterLinkConfiguration configuration = 3;
    // Status of the cluster link
    ClusterLinkStatus status = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

/* RPC Requests and Responses */
// Create a new cluster link
message CreateClusterLinkRequest {
    // The cluster link to create
    ClusterLink cluster_link = 1;
}
// Request to delete a cluster link
message DeleteClusterLinkRequest {
    // The name of the link to delete
    string name = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference) = {
            type: "redpanda.core.admin.ClusterLinkService/ClusterLink"
        }
    ];
}
message DeleteClusterLinkResponse {}
message GetClusterLinkRequest {
    // The name of the cluster link to get
    string name = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference) = {
            type: "redpanda.core.admin.ClusterLinkService/ClusterLink"
        }
    ];
}
// Request to list all cluster links
message ListClusterLinksRequest {}
// All cluster links on the cluster
message ListClusterLinksResponse {
    // The cluster links
    repeated ClusterLink cluster_links = 1;
}
// Updates a cluster link
message UpdateClusterLinkRequest {
    // The cluster link to update
    ClusterLink cluster_link = 1;

    // The list of fields to update
    // See [AIP-134](https://google.aip.dev/134) for how to use `field_mask`
    google.protobuf.FieldMask update_mask = 2;
}
// Request to fail over a cluster link or a single mirror topic
message FailOverRequest {
    // The name of the cluster link to fail over
    string name = 1 [
        (google.api.field_behavior) = REQUIRED,
        (google.api.resource_reference) = {
            type: "redpanda.core.admin.ClusterLinkService/ClusterLink"
        }
    ];
    // The name of the mirror topic to fail over, if not set will fail over
    // the entire cluster link
    string mirror_topic_name = 2 [(google.api.field_behavior) = OPTIONAL];
}

/* Other Messages */
// ClusterLink options
message ClusterLinkConfiguration {
    // Configuration for the internal kafka client
    ClusterLinkClientOptions client_options = 1;
    // Topic metadata sync options
    TopicMetadataSyncOptions topic_metadata_sync_options = 2;
    // Consumer offset sync options
    ConsumerOffsetSyncOptions consumer_offset_sync_options = 3;
    // Security settings sync options
    SecuritySettingsSyncOptions security_sync_options = 4;
}
// Options for the client link
message ClusterLinkClientOptions {
    // The bootstrap servers to use
    repeated string bootstrap_servers = 1
        [(google.api.field_behavior) = REQUIRED];
    // The Client ID
    string client_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
    // If provided, this is the expected ID of the source cluster.  If it does
    // not match then the connection will be rejected.  If provided, this value
    // must match the `ClusterId` field returned in the metadata response
    string source_cluster_id = 3;
    // TLS settings
    optional TLSSettings tls_settings = 4;
    // Authentication settings
    optional AuthenticationConfig authentication_config = 5;
    // Max metadata age
    // If 0 is provided, defaults to 10 seconds
    int32 metadata_max_age_ms = 6;
    // Connection timeout
    // If 0 is provided, defaults to 1 second
    int32 connection_timeout_ms = 7;
    // Retry base backoff
    // If 0 is provided, defaults to 100ms
    int32 retry_backoff_ms = 8;
    // Fetch request timeout
    // If 0 is provided, defaults to 100ms
    int32 fetch_wait_max_ms = 9;
    // Fetch min bytes
    // If 0 is provided, defaults to 1 byte
    int32 fetch_min_bytes = 10;
    // Fetch max bytes
    // If 0 is provided, defaults to 1MiB
    int32 fetch_max_bytes = 11;
}
// Options for syncing topic metadata
message TopicMetadataSyncOptions {
    // How often to sync metadata
    // If 0 provided, defaults to 30 seconds
    google.protobuf.Duration interval = 1;
    // The topic filters to use
    repeated NameFilter topic_filters = 2;
    // Additional topic properties to mirror
    // Replication factor, `max.message.bytes`, `cleanup.policy` and
    // `timestamp.type` will always be replicated
    repeated string mirrored_topic_properties = 3;
}
// Options for syncing consumer offsets
message ConsumerOffsetSyncOptions {
    // Sync interval
    // If 0 provided, defaults to 30 seconds
    google.protobuf.Duration interval = 1;
    // Whether it's enabled
    bool enabled = 2;
    // The filters
    repeated NameFilter group_filters = 3;
}
// Options for syncing security settings
message SecuritySettingsSyncOptions {
    // Sync interval
    // If 0 provided, defaults to 30 seconds
    google.protobuf.Duration interval = 1;
    // Whether or not it's enabled
    bool enabled = 2;
    // Role filters
    repeated NameFilter role_filters = 3;
    // SCRAM credential filters
    repeated NameFilter scram_cred_filters = 4;
    // ACL filters
    repeated ACLFilter acl_filters = 5;
}
// TLS settings
message TLSSettings {
    // May provide TLS as a set of files or PEM values
    oneof tls_oneof {
        TLSFileSettings tls_file_settings = 1;
        TLSPEMSettings tls_pem_settings = 2;
    }
}
// Authentication config.  Currently only supporting SASL/SCRAM,
// however made as a oneof for expansion
message AuthenticationConfig {
    oneof authentication_oneof {
        ScramConfig scram_config = 1;
    }
}
// TLS file settings
message TLSFileSettings {
    // Path to the CA
    string ca_path = 1;
    // Key and Cert are optional but if one is provided, then both must be
    // Path to the key
    string key_path = 2;
    // Path to the cert
    string cert_path = 3;
}
// Used when providing the TLS information in PEM format
message TLSPEMSettings {
    // The CA
    string ca = 1;
    // Key and Cert are optional but if one is provided, then both must be
    // The key
    string key = 2 [(google.api.field_behavior) = INPUT_ONLY];
    // Indicates that the key has been set
    bool key_set = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The cert
    string cert = 4;
}
// SCRAM settings
message ScramConfig {
    // SCRAM username
    string username = 1;
    // Password
    string password = 2 [(google.api.field_behavior) = INPUT_ONLY];
    // Indicates that the password has been set
    bool password_set = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
    // The SCRAM mechanism to use
    ScramMechanism scram_mechanism = 4;
}
// A filter based on the name of a resource
message NameFilter {
    // Literal or prefix
    PatternType pattern_type = 1;
    // Include or exclude
    FilterType filter_type = 2;
    // The resource name, or "*"
    // Note if "*", must be the _only_ character
    // and `pattern_type` must be `PATTERN_TYPE_LITERAL`
    string name = 3;
}
// A filter for ACLs
message ACLFilter {
    // The resource filter
    ACLResourceFilter resource_filter = 1;
    // The access filter
    ACLAccessFilter access_filter = 2;
}
// A filter to match ACLs for resources
message ACLResourceFilter {
    // The ACL resource type to match
    common.ACLResource resource_type = 1;
    // The pattern to apply to name
    common.ACLPattern pattern_type = 2;
    // Name, if not given will default to match all items in `resource_type`.
    // Note that asterisk `*` is literal and matches resource ACLs
    // that are named `*`
    string name = 3;
}
// Filter an ACL based on its access
message ACLAccessFilter {
    // The name of the principal, if not set will default to match
    // all principals with the specified `operation` and `permission_type`
    string principal = 1;
    // The ACL operation to match
    common.ACLOperation operation = 2;
    // The permission type
    common.ACLPermissionType permission_type = 3;
    // The host to match.  If not set, will default to match all hosts
    // with the specified `operation` and `permission_type`. Note that
    // the asterisk `*` is literal and matches hosts that are set to `*`
    string host = 4;
}
// Status of the cluster link
message ClusterLinkStatus {
    ClusterLinkState state = 1;
    // Statuses of the running tasks
    repeated TaskStatus task_status = 2;
    // Status of mirror topics
    repeated MirrorTopicStatus mirror_topic_status = 3;
}
// Status of a task
message TaskStatus {
    // Name of the task
    string name = 1;
    // State of the task
    TaskState state = 2;
    // Reason for task being in state
    string reason = 3;
    // The broker the task is running on
    int32 broker_id = 4;
}
// Status of a MirrorTopic
message MirrorTopicStatus {
    string name = 1;
    string topic_id = 2;
    MirrorTopicState state = 3;
    repeated TopicPartitionInformation partition_information = 4;
}
// Topic partition information
message TopicPartitionInformation {
    // Partition ID
    int64 partition_id = 1;
    // Source partition's LSO
    int64 source_last_stable_offset = 2;
    // Source partition's HWM
    int64 source_high_watermark = 3;
    // Mirrored partition's HWM
    int64 high_watermark = 4;
}

/* Enums */
// State of the cluster link
enum ClusterLinkState {
    // Unspecified
    CLUSTER_LINK_STATE_UNSPECIFIED = 0;
    // Cluster link is active
    CLUSTER_LINK_STATE_ACTIVE = 1;
    // Cluster link was paused
    CLUSTER_LINK_STATE_PAUSED = 2;
    // Cluster link is in the process of failing over
    CLUSTER_LINK_STATE_FAILING_OVER = 3;
    // Cluster link was failed over
    CLUSTER_LINK_STATE_FAILED_OVER = 4;
}
// Valid SCRAM mechanisms
enum ScramMechanism {
    SCRAM_MECHANISM_UNSPECIFIED = 0;
    SCRAM_MECHANISM_SCRAM_SHA_256 = 1;
    SCRAM_MECHANISM_SCRAM_SHA_512 = 2;
}
// The matching pattern type
enum PatternType {
    PATTERN_TYPE_UNSPECIFIED = 0;
    // Must match the filter exactly
    PATTERN_TYPE_LITERAL = 1;
    // Will match anything that starts with filter
    PATTERN_TYPE_PREFIX = 2;
}
// What type of filter this is, include or exclude
enum FilterType {
    FILTER_TYPE_UNSPECIFIED = 0;
    FILTER_TYPE_INCLUDE = 1;
    FILTER_TYPE_EXCLUDE = 2;
}

// Task states
enum TaskState {
    TASK_STATE_UNSPECIFIED = 0;
    // Task is active
    TASK_STATE_ACTIVE = 1;
    // Task was paused
    TASK_STATE_PAUSED = 2;
    // Task is unable to communicate with source cluster
    TASK_STATE_LINK_UNAVAILABLE = 3;
    // Task is not running
    TASK_STATE_NOT_RUNNING = 4;
    // Task is faulted
    TASK_STATE_FAULTED = 5;
}
// State of a mirror topic
enum MirrorTopicState {
    MIRROR_TOPIC_STATE_UNSPECIFIED = 0;
    // Mirror topic is active
    MIRROR_TOPIC_STATE_ACTIVE = 1;
    // Mirror topic has been promoted
    MIRROR_TOPIC_STATE_PROMOTED = 2;
    // Mirror topic has faulted
    MIRROR_TOPIC_STATE_FAULTED = 3;
}